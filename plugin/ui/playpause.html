<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Play / Pause Settings</title>
		<link rel="stylesheet" href="css/sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<!-- Local Action Settings -->
			<div class="sdpi-heading" data-i18n="action.settings">Action Settings</div>

			<div class="sdpi-item">
				<label class="sdpi-checkbox-wrap">
					<input type="checkbox" id="showCoverAsBackground" checked />
					<span data-i18n="playpause.cover_bg.label">Album cover as button background</span>
				</label>
			</div>
			<div class="sdpi-hint" data-i18n="playpause.cover_bg.hint">
				When enabled, the album cover of the current track is displayed directly on the button.
			</div>

			<!-- Global Settings container dynamically rendered by global-settings.js -->
			<div id="global-settings-container"></div>

			<div class="sdpi-heading" data-i18n="controls.heading">Controls</div>
			<div class="sdpi-hint" data-i18n="playpause.controls.hint">
				• <strong>Short Press</strong>: Toggle Play / Pause<br />
				• <strong>Long Press (Hold)</strong>: Bring YouTube Music / PWA to foreground
			</div>
		</div>

		<script src="i18n.js"></script>
		<script src="streamdeck-client.js"></script>
		<script src="global-settings.js"></script>
		<script src="playpause.js"></script>
	</body>
</html>
