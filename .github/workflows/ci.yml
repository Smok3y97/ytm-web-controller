name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ci.yml'
      - 'extension/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'package.json'
      - 'version.json'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ci.yml'
      - 'extension/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'package.json'
      - 'version.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Lint, Build, Validate & Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugin/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix plugin

      # 1. Linting, Typecheck & Prettier Check (fails fast on syntax/type/style issues before packaging or system installs)
      - name: Lint, Typecheck and Prettier Check
        run: npm run lint

      # 2. Add local plugin node_modules CLI binaries (streamdeck) to PATH
      - name: Add local CLI binaries to PATH
        run: echo "$GITHUB_WORKSPACE/plugin/node_modules/.bin" >> $GITHUB_PATH

      # 3. Install lightweight Mono C# compiler for Windows focus helper
      - name: Install Mono Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs

      # 4. Compile Plugin Bundle via Rollup
      - name: Build Plugin Bundle
        run: npm run build

      # 5. Compile Native Windows Focus Helper Binary
      - name: Compile Focus Helper Binary
        run: |
          mkdir -p plugin/com.smok3y97.ytmusicweb.sdPlugin/bin
          mcs -target:winexe -optimize+ -out:plugin/com.smok3y97.ytmusicweb.sdPlugin/bin/ytm-focus.exe scripts/ytm-focus.cs

      # 6. Official Elgato Stream Deck Plugin Validation
      - name: Validate Stream Deck Plugin
        run: npm run validate

      # 7. Package Stream Deck Plugin (.streamDeckPlugin)
      - name: Pack Stream Deck Plugin
        run: |
          mkdir -p release
          streamdeck pack plugin/com.smok3y97.ytmusicweb.sdPlugin -o release --force

      # 8. Package Browser Extension (.zip)
      - name: Pack Browser Extension
        run: |
          mkdir -p release
          cd extension
          zip -r ../release/extension.zip . -x "*.git*"
          cd ..

      # 9. Upload Build Artifacts
      - name: Upload Stream Deck Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.smok3y97.ytmusicweb.streamDeckPlugin
          path: release/com.smok3y97.ytmusicweb.streamDeckPlugin
          if-no-files-found: error

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension.zip
          path: release/extension.zip
          if-no-files-found: error
