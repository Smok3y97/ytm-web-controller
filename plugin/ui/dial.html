<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dial Settings</title>
  <link rel="stylesheet" href="css/sdpi.css">
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Display Einstellungen</div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Titel Template</div>
      <div class="sdpi-item-value">
        <input type="text" id="titleTemplate" placeholder="{artist} - {title}" value="{artist} - {title}">
      </div>
    </div>
    <div class="sdpi-hint">
      Platzhalter: {title}, {artist}, {album}
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Zeit Template</div>
      <div class="sdpi-item-value">
        <input type="text" id="timeTemplate" placeholder="{remaining}" value="{remaining}">
      </div>
    </div>
    <div class="sdpi-hint">
      Platzhalter: {current}, {duration}, {remaining}
    </div>

    <div class="sdpi-item">
      <label class="sdpi-checkbox-wrap">
        <input type="checkbox" id="showCover" checked>
        <span>Cover Thumbnail auf Touchstrip anzeigen</span>
      </label>
    </div>

    <div class="sdpi-heading">Steuerung</div>
    <div class="sdpi-hint">
      • <strong>Drehen nach rechts:</strong> Nächster Track<br>
      • <strong>Drehen nach links:</strong> Vorheriger Track<br>
      • <strong>Drücken / Tippen:</strong> Play / Pause
    </div>
  </div>

  <script src="dial.js"></script>
</body>
</html>
