name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Lint, Build, Validate & Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugin/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix plugin

      # 1. Linting & Typecheck (fails fast on syntax/type issues before packaging or system installs)
      - name: Lint and Typecheck
        run: npm run lint

      # 2. Add local plugin node_modules CLI binaries (streamdeck) to PATH
      - name: Add local CLI binaries to PATH
        run: echo "$GITHUB_WORKSPACE/plugin/node_modules/.bin" >> $GITHUB_PATH

      # 3. Install lightweight Mono C# compiler for Windows focus helper
      - name: Install Mono Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs

      # 4. Assembling & Packaging (Rollup build, C# focus helper, icons & staging)
      - name: Package Plugin & Extension
        shell: pwsh
        run: ./scripts/package_plugin.ps1

      # 5. Official Elgato Stream Deck Plugin Validation
      - name: Validate Stream Deck Plugin
        run: streamdeck validate --no-update-check release/com.smok3y97.ytmusicweb.sdPlugin

      # 6. Stage release binaries as workflow artifact for publishing
      - name: Upload Release Binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            release/com.smok3y97.ytmusicweb.streamDeckPlugin
            release/extension.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [validate-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/com.smok3y97.ytmusicweb.streamDeckPlugin
            release/extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
