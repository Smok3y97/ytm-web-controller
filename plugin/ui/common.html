<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Music Web Controller</title>
  <link rel="stylesheet" href="css/sdpi.css">
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Information</div>
    <div class="sdpi-info-box">
      <strong>YouTube Music Web Controller</strong><br>
      Diese Taste reagiert direkt auf die geöffnete YouTube Music Web-App via lokalem WebSocket.
      <br><br>
      Globale Einstellungen (wie Port oder Discord RPC) können zentral über die <strong>Play/Pause</strong>- oder <strong>Dial</strong>-Taste konfiguriert werden.
    </div>
  </div>
</body>
</html>
