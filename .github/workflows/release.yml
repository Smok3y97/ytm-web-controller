name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Lint, Build, Validate & Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugin/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix plugin

      # 1. Linting & Typecheck (fails fast on syntax/type issues before packaging or system installs)
      - name: Lint and Typecheck
        run: npm run lint

      # 2. Add local plugin node_modules CLI binaries (streamdeck) to PATH
      - name: Add local CLI binaries to PATH
        run: echo "$GITHUB_WORKSPACE/plugin/node_modules/.bin" >> $GITHUB_PATH

      # 3. Install lightweight Mono C# compiler for Windows focus helper
      - name: Install Mono Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs

      # 4. Compile Plugin Bundle via Rollup
      - name: Build Plugin Bundle
        run: npm run build

      # 5. Compile Native Windows Focus Helper Binary
      - name: Compile Focus Helper Binary
        run: |
          mkdir -p plugin/com.smok3y97.ytmusicweb.sdPlugin/bin
          mcs -target:winexe -optimize+ -out:plugin/com.smok3y97.ytmusicweb.sdPlugin/bin/ytm-focus.exe scripts/ytm-focus.cs

      # 6. Official Elgato Stream Deck Plugin Validation
      - name: Validate Stream Deck Plugin
        run: npm run validate

      # 7. Package Stream Deck Plugin (.streamDeckPlugin)
      - name: Pack Stream Deck Plugin
        run: |
          mkdir -p release
          streamdeck pack plugin/com.smok3y97.ytmusicweb.sdPlugin -o release --force

      # 8. Package Browser Extension (.zip)
      - name: Pack Browser Extension
        run: |
          mkdir -p release
          cd extension
          zip -r ../release/extension.zip . -x "*.git*"
          cd ..

      # 9. Stage release binaries as workflow artifact for publishing
      - name: Upload Release Binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            release/com.smok3y97.ytmusicweb.streamDeckPlugin
            release/extension.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [validate-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/com.smok3y97.ytmusicweb.streamDeckPlugin
            release/extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
