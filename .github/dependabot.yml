version: 2
updates:
  # Stream Deck Plugin npm dependencies
  - package-ecosystem: "npm"
    directory: "/plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Keep TypeScript on 5.x for Elgato SDK & Rollup compatibility (minor & patch updates allowed)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep ESLint on 9.x for @elgato/eslint-config peer dependency compatibility (minor & patch updates allowed)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Keep Prettier on 3.x for @elgato/prettier-config peer dependency compatibility (minor & patch updates allowed)
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      # Keep Node types aligned with Stream Deck Node.js 24 runtime (minor & patch updates allowed)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
