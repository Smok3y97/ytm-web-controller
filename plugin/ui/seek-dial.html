<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Seek Dial Settings</title>
		<link rel="stylesheet" href="css/sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<div class="sdpi-heading" data-i18n="seekdial.heading">Seek Dial Settings</div>

			<div class="sdpi-item">
				<div class="sdpi-item-label" data-i18n="seekdial.step.label">Seek Step</div>
				<div class="sdpi-item-value sdpi-range-wrap">
					<input type="range" id="seekStep" min="5" max="120" step="5" value="10" />
					<span class="sdpi-range-value" id="seekStepVal">10s</span>
				</div>
			</div>
			<div class="sdpi-hint" data-i18n="seekdial.step.hint">
				Seconds to scrub forward or backward per dial tick (5s – 120s, Default: 10s).
			</div>

			<div class="sdpi-item">
				<div class="sdpi-item-label" data-i18n="seekdial.title_template.label">Title Template</div>
				<div class="sdpi-item-value">
					<input type="text" id="titleTemplate" placeholder="{artist} - {title}" value="{artist} - {title}" />
				</div>
			</div>
			<div class="sdpi-hint" data-i18n="seekdial.title_template.hint">
				Placeholders: <code>{artist}</code>, <code>{title}</code>, <code>{album}</code>
			</div>

			<div class="sdpi-item">
				<div class="sdpi-item-label" data-i18n="seekdial.time_template.label">Time Template</div>
				<div class="sdpi-item-value">
					<input type="text" id="timeTemplate" placeholder="{both}" value="{both}" />
				</div>
			</div>
			<div class="sdpi-hint" data-i18n="seekdial.time_template.hint">
				Placeholders: <code>{current}</code>, <code>{duration}</code>, <code>{remaining}</code>, <code>{both}</code>
			</div>

			<div class="sdpi-item">
				<label class="sdpi-checkbox-wrap">
					<input type="checkbox" id="showCover" checked />
					<span data-i18n="seekdial.show_cover.label">Show cover thumbnail on touchstrip</span>
				</label>
			</div>

			<!-- Global Settings container dynamically rendered by global-settings.js -->
			<div id="global-settings-container"></div>
		</div>

		<script src="i18n.js"></script>
		<script src="streamdeck-client.js"></script>
		<script src="global-settings.js"></script>
		<script src="seek-dial.js"></script>
	</body>
</html>
