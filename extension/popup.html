<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Music Web Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="12" r="10" fill="#FF0000"/>
            <polygon points="9.5,7.5 16.5,12 9.5,16.5" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>YTM Web Controller</h1>
          <span class="subtitle">Stream Deck Bridge</span>
        </div>
      </div>
      <div id="status-badge" class="status-badge disconnected">
        <span class="dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <main class="content">
      <div class="card">
        <label for="ws-port" class="field-label">WebSocket Server Port</label>
        <div class="input-row">
          <input type="number" id="ws-port" min="1024" max="65535" value="39865" placeholder="39865">
          <button id="save-port-btn" class="btn btn-primary">Save</button>
        </div>
        <p class="field-hint">Must match the port configured in Stream Deck Property Inspector.</p>
      </div>

      <div class="card">
        <div class="action-buttons">
          <button id="test-connection-btn" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
            </svg>
            Test Connection
          </button>
          <a href="https://music.youtube.com" target="_blank" class="btn btn-outline">
            Open YouTube Music
          </a>
        </div>
      </div>

      <div id="toast-message" class="toast hidden"></div>
    </main>

    <footer class="footer">
      <span id="version-text">v1.1.0 • Open Source</span>
      <a href="https://github.com/smok3y97/ytm-web-controller" target="_blank">GitHub</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
