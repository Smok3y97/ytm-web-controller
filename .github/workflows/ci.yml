name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - 'screenshots/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - 'screenshots/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'

jobs:
  build-and-validate:
    name: Lint, Build, Validate & Package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugin/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix plugin

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@latest

      # 1. Linting & Typecheck (fails fast on syntax/type issues before packaging)
      - name: Lint and Typecheck
        run: npm run lint

      # 2. Assembling & Packaging (Rollup build, C# focus helper, icons & staging)
      - name: Package Plugin & Extension
        shell: pwsh
        run: ./scripts/package_plugin.ps1

      # 3. Official Elgato Stream Deck Plugin Validation
      - name: Validate Stream Deck Plugin
        run: streamdeck validate --no-update-check release/com.smok3y97.ytmusicweb.sdPlugin

      # 4. Upload Build Artifacts
      - name: Upload Stream Deck Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.smok3y97.ytmusicweb.streamDeckPlugin
          path: release/com.smok3y97.ytmusicweb.streamDeckPlugin
          if-no-files-found: error

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension.zip
          path: release/extension.zip
          if-no-files-found: error
